services:
  sql-server-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: sql-server-db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=YourStrongPassword123!
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-S", "localhost", "-U", "sa", "-P", "YourStrongPassword123!", "-Q", "SELECT 1", "-No"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  glms-backend-api:
    image: glms-backend-api
    build:
      context: .
      dockerfile: GLMS.API/Dockerfile
    container_name: glms-backend-api
    ports:
      - "5001:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Server=sql-server-db;Database=GLMS_Db;User Id=sa;Password=YourStrongPassword123!;Encrypt=True;TrustServerCertificate=True;
      - AdminLogin__Username=admin
      - AdminLogin__Password=Admin@123
      - Jwt__Key=SuperSecretKey1234567890AtHashDollarJwtSecretString
      - Jwt__Issuer=glms-backend-api
      - Jwt__Audience=glms-frontend-web
      - CurrencyApi__BaseUrl=https://open.er-api.com/v6/latest/USD
    depends_on:
      sql-server-db:
        condition: service_healthy

  glms-frontend-web:
    image: glms-frontend-web
    build:
      context: .
      dockerfile: GLMS.Web/Dockerfile
    container_name: glms-frontend-web
    ports:
      - "5000:8080"
    environment:
      - ApiSettings__BaseUrl=http://glms-backend-api:8080
    depends_on:
      - glms-backend-api
